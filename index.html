<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LD Extreme Academia | Sistema</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #080808;
      --bg2: #111111;
      --card: #171717;
      --card2: #202020;
      --text: #ffffff;
      --muted: #a7a7a7;
      --line: rgba(255,255,255,.1);
      --red: #e50914;
      --red2: #ff1f2d;
      --green: #24c96b;
      --yellow: #f5b942;
      --blue: #4da3ff;
      --danger: #ff3b3b;
      --radius: 18px;
      --shadow: 0 20px 50px rgba(0,0,0,.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, Arial, Helvetica, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(229,9,20,.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(255,255,255,.08), transparent 32%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hidden {
      display: none !important;
    }

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .login-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(110deg, rgba(0,0,0,.92), rgba(0,0,0,.58)),
        url("logo.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: min(650px, 85vw);
      opacity: .18;
      pointer-events: none;
    }

    .login-card {
      position: relative;
      width: min(440px, 100%);
      background: rgba(18,18,18,.92);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 34px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--red), #8f0008);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 22px;
      box-shadow: 0 12px 35px rgba(229,9,20,.35);
    }

    .login-brand h1 {
      font-size: 24px;
      line-height: 1.05;
      text-transform: uppercase;
    }

    .login-brand span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
      text-transform: none;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      color: #ddd;
      font-size: 13px;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input, select, textarea {
      width: 100%;
      background: #0f0f0f;
      border: 1px solid rgba(255,255,255,.14);
      color: var(--text);
      border-radius: 14px;
      padding: 13px 14px;
      outline: none;
      transition: .2s;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(229,9,20,.18);
    }

    .btn {
      min-height: 43px;
      padding: 11px 16px;
      border-radius: 14px;
      color: #fff;
      background: var(--card2);
      border: 1px solid rgba(255,255,255,.12);
      font-weight: 800;
      transition: .2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--red), #b60009);
      border-color: rgba(255,255,255,.12);
      box-shadow: 0 12px 28px rgba(229,9,20,.25);
    }

    .btn-green {
      background: linear-gradient(135deg, #1fb563, #0f7d40);
    }

    .btn-yellow {
      background: linear-gradient(135deg, #d99a16, #b37400);
    }

    .btn-blue {
      background: linear-gradient(135deg, #2c83e5, #16529b);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ff3b3b, #af1111);
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid rgba(255,255,255,.14);
    }

    .btn-small {
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 11px;
      font-size: 12px;
    }

    .full {
      width: 100%;
    }

    .error-box {
      margin-top: 14px;
      color: #fff;
      background: rgba(229,9,20,.18);
      border: 1px solid rgba(229,9,20,.35);
      padding: 12px;
      border-radius: 14px;
      font-size: 14px;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
    }

    .sidebar {
      background: rgba(11,11,11,.96);
      border-right: 1px solid var(--line);
      padding: 22px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }

    .logo-box img {
      width: 62px;
      max-height: 50px;
      object-fit: contain;
      display: none;
    }

    .logo-box h2 {
      font-size: 17px;
      text-transform: uppercase;
      line-height: 1.05;
    }

    .logo-box small {
      color: var(--muted);
      display: block;
      margin-top: 5px;
      font-size: 12px;
    }

    .user-chip {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 18px;
    }

    .user-chip strong {
      display: block;
      font-size: 14px;
    }

    .user-chip span {
      display: inline-block;
      margin-top: 7px;
      background: rgba(229,9,20,.18);
      color: #ffb5ba;
      border: 1px solid rgba(229,9,20,.28);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .menu {
      display: grid;
      gap: 8px;
    }

    .menu button {
      width: 100%;
      justify-content: flex-start;
      text-align: left;
      background: transparent;
      color: #d8d8d8;
      border: 1px solid transparent;
      padding: 12px 13px;
      border-radius: 14px;
      font-weight: 800;
      transition: .2s;
    }

    .menu button:hover,
    .menu button.active {
      background: rgba(229,9,20,.13);
      border-color: rgba(229,9,20,.27);
      color: #fff;
    }

    .menu .admin-only-label {
      margin: 16px 0 4px;
      color: #777;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .main {
      padding: 28px;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 24px;
    }

    .topbar h1 {
      font-size: clamp(24px, 4vw, 38px);
      text-transform: uppercase;
      letter-spacing: -.04em;
    }

    .topbar p {
      color: var(--muted);
      margin-top: 5px;
    }

    .mobile-menu-btn {
      display: none;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.025));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    .card .kpi-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .card .kpi-value {
      font-size: 32px;
      font-weight: 950;
      margin-top: 8px;
      letter-spacing: -.04em;
    }

    .card.red {
      border-color: rgba(229,9,20,.35);
      background: linear-gradient(160deg, rgba(229,9,20,.18), rgba(255,255,255,.03));
    }

    .card.green {
      border-color: rgba(36,201,107,.35);
      background: linear-gradient(160deg, rgba(36,201,107,.16), rgba(255,255,255,.03));
    }

    .card.yellow {
      border-color: rgba(245,185,66,.35);
      background: linear-gradient(160deg, rgba(245,185,66,.15), rgba(255,255,255,.03));
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .panel {
      background: rgba(17,17,17,.92);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.22);
      margin-bottom: 18px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .panel-header h2 {
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: -.02em;
    }

    .panel-header p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
    }

    .toolbar input,
    .toolbar select {
      width: auto;
      min-width: 230px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 14px;
    }

    .form-grid .span-2 {
      grid-column: span 2;
    }

    .form-grid .span-3 {
      grid-column: span 3;
    }

    .table-wrap {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
      background: rgba(255,255,255,.02);
    }

    th, td {
      padding: 13px 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      text-align: left;
      vertical-align: middle;
      font-size: 14px;
    }

    th {
      color: #cfcfcf;
      background: rgba(255,255,255,.045);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .05em;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:hover td {
      background: rgba(255,255,255,.025);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 950;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,.1);
    }

    .badge.green {
      background: rgba(36,201,107,.14);
      color: #7ef0ad;
      border-color: rgba(36,201,107,.28);
    }

    .badge.red {
      background: rgba(229,9,20,.15);
      color: #ff9fa6;
      border-color: rgba(229,9,20,.3);
    }

    .badge.yellow {
      background: rgba(245,185,66,.14);
      color: #ffd57e;
      border-color: rgba(245,185,66,.28);
    }

    .badge.gray {
      background: rgba(255,255,255,.08);
      color: #d2d2d2;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(980px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: #121212;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .modal.small {
      width: min(560px, 100%);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 15px;
    }

    .modal-head h2 {
      text-transform: uppercase;
      font-size: 20px;
    }

    .modal-head p {
      color: var(--muted);
      margin-top: 5px;
      font-size: 13px;
    }

    .close {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font-size: 20px;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 99;
      background: #161616;
      border: 1px solid rgba(255,255,255,.12);
      color: #fff;
      border-radius: 16px;
      padding: 14px 16px;
      min-width: 260px;
      box-shadow: var(--shadow);
      display: none;
    }

    .toast.show {
      display: block;
    }

    .toast.success {
      border-color: rgba(36,201,107,.35);
    }

    .toast.error {
      border-color: rgba(229,9,20,.45);
    }

    .empty {
      color: var(--muted);
      padding: 22px;
      text-align: center;
      border: 1px dashed rgba(255,255,255,.12);
      border-radius: 16px;
      background: rgba(255,255,255,.025);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tabs button {
      padding: 9px 13px;
      border-radius: 12px;
      background: rgba(255,255,255,.07);
      color: #fff;
      font-weight: 850;
      border: 1px solid rgba(255,255,255,.1);
    }

    .tabs button.active {
      background: rgba(229,9,20,.2);
      border-color: rgba(229,9,20,.35);
    }

    .debt-list {
      display: grid;
      gap: 10px;
    }

    .debt-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 15px;
      padding: 13px;
    }

    .debt-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .debt-item span {
      color: var(--muted);
      font-size: 13px;
    }

    .total-box {
      background: linear-gradient(135deg, rgba(229,9,20,.18), rgba(255,255,255,.04));
      border: 1px solid rgba(229,9,20,.25);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 14px;
    }

    .total-box strong {
      font-size: 24px;
    }

    .public-treino {
      min-height: 100vh;
      padding: 22px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(229,9,20,.22), transparent 35%),
        var(--bg);
    }

    .public-card {
      width: min(920px, 100%);
      background: rgba(17,17,17,.96);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .exercise-card {
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .ficha-treino-box {
  background: #101010;
  border: 1px solid rgba(255,255,255,.14);
}

.ficha-head {
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  border: 1px solid rgba(255,255,255,.25);
  border-bottom: 0;
}

.ficha-head.ficha-full {
  grid-template-columns: 1fr;
}

.ficha-head div {
  border-right: 1px solid rgba(255,255,255,.22);
  padding: 8px 10px;
  min-height: 48px;
}

.ficha-head div:last-child {
  border-right: 0;
}

.ficha-head strong {
  display: block;
  font-size: 11px;
  color: #bcbcbc;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.ficha-head span {
  display: block;
  color: #fff;
  font-weight: 700;
}

.treino-section-title {
  margin-top: 16px;
  background: rgba(255,255,255,.16);
  color: #fff;
  border: 1px solid rgba(255,255,255,.18);
  text-align: center;
  padding: 8px;
  font-weight: 950;
  text-transform: uppercase;
  letter-spacing: .05em;
}

.ficha-table-wrap {
  border-radius: 0 0 14px 14px;
}

.ficha-table {
  min-width: 980px;
}

.ficha-table th {
  text-align: center;
  font-size: 11px;
}

.ficha-table td {
  text-align: center;
}

.ficha-table td:nth-child(2) {
  text-align: left;
}

@media (max-width: 760px) {
  .ficha-head {
    grid-template-columns: 1fr;
  }

  .ficha-head div {
    border-right: 0;
    border-bottom: 1px solid rgba(255,255,255,.16);
  }

  .ficha-table {
    min-width: 900px;
  }
}

    .exercise-card h4 {
      margin-bottom: 8px;
      color: #fff;
    }

    .exercise-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: #ddd;
      font-size: 13px;
    }

    .exercise-meta span {
      background: rgba(255,255,255,.07);
      padding: 6px 9px;
      border-radius: 999px;
    }

    @media (max-width: 1080px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        z-index: 40;
        left: -310px;
        width: 290px;
        transition: .2s;
      }

      .sidebar.show {
        left: 0;
      }

      .mobile-menu-btn {
        display: inline-flex;
      }

      .cards {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }

      .grid-2 {
        grid-template-columns: 1fr;
      }

      .main {
        padding: 18px;
      }
    }

    @media (max-width: 760px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-grid .span-2,
      .form-grid .span-3 {
        grid-column: span 1;
      }

      .toolbar input,
      .toolbar select {
        width: 100%;
        min-width: 100%;
      }

      .topbar {
        align-items: flex-start;
      }

      .topbar h1 {
        font-size: 25px;
      }

      .login-card {
        padding: 24px;
      }

      .debt-item {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div id="publicTreino" class="public-treino hidden">
    <div class="public-card">
      <div class="panel-header">
        <div>
          <h2>LD Extreme Academia</h2>
          <p>Área do aluno | Ficha de treino</p>
        </div>
        <button class="btn btn-ghost" onclick="window.location.href='index.html'">Voltar</button>
      </div>

      <div id="treinoLoginBox">
        <div class="form-grid">
          <div class="form-group">
            <label>Código do aluno</label>
            <input id="publicCodigoAluno" placeholder="Ex: LD0001" />
          </div>

          <div class="form-group">
            <label>Senha do treino</label>
            <input id="publicSenhaTreino" type="password" placeholder="Senha do aluno" />
          </div>

          <div class="form-group" style="align-self:end;">
            <button class="btn btn-primary full" onclick="acessarTreinoPublico()">Acessar treino</button>
          </div>
        </div>
      </div>

      <div id="publicTreinoConteudo" class="hidden"></div>
    </div>
  </div>

  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark">LD</div>
        <div>
          <h1>LD Extreme</h1>
          <span>Sistema de gestão da academia</span>
        </div>
      </div>

      <div class="form-group">
        <label>Usuário</label>
        <input id="loginUsuario" placeholder="Digite seu usuário" autocomplete="username" />
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input id="loginSenha" type="password" placeholder="Digite sua senha" autocomplete="current-password" />
      </div>

      <button class="btn btn-primary full" onclick="login()">Entrar no sistema</button>

      <div id="loginErro" class="error-box hidden"></div>

      <div style="margin-top:18px;color:var(--muted);font-size:13px;line-height:1.5;">
        <strong style="color:#fff;">Acesso inicial</strong><br>
        Admin: ldacademia<br>
        Funcionário: user
      </div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="logo-box">
        <div class="brand-mark">LD</div>
        <div>
          <h2>LD Extreme</h2>
          <small>Academia</small>
        </div>
      </div>

      <div class="user-chip">
        <strong id="usuarioNome">Usuário</strong>
        <span id="usuarioPerfil">perfil</span>

      if (venc < new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate())) {
        venc = new Date(ano, mes + 1, Number(dia || 10));
      }

      const y = venc.getFullYear();
      const m = String(venc.getMonth() + 1).padStart(2, "0");
      const d = String(venc.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;

    async function carregarBase() {
  const planosReq = client.from("planos").select("*").order("valor", { ascending: true });

  const alunosReq = client
    .from("alunos")
    .select("*, planos(nome)")
    .eq("ativo", true)
    .order("criado_em", { ascending: false });

  const mensalidadesReq = client
    .from("mensalidades")
    .select("*, alunos(codigo,nome,telefone), planos(nome)")
    .order("data_vencimento", { ascending: false });

  const produtosReq = client
    .from("produtos")
    .select("*")
    .order("nome", { ascending: true });

  const [planosRes, alunosRes, mensalidadesRes, produtosRes] = await Promise.all([
    planosReq,
    alunosReq,
    mensalidadesReq,
    produtosReq
  ]);

  if (planosRes.error) mostrarToast("Erro ao carregar planos: " + planosRes.error.message, "error");
  if (alunosRes.error) mostrarToast("Erro ao carregar alunos: " + alunosRes.error.message, "error");
  if (mensalidadesRes.error) mostrarToast("Erro ao carregar mensalidades: " + mensalidadesRes.error.message, "error");
  if (produtosRes.error) mostrarToast("Erro ao carregar produtos: " + produtosRes.error.message, "error");

  planosCache = planosRes.data || [];
  alunosCache = alunosRes.data || [];
  mensalidadesCache = mensalidadesRes.data || [];
  produtosCache = produtosRes.data || [];
}

                  "Reabilitação",

    function atualizarValorPlanoNoAluno() {
      const planoId = document.getElementById("alunoPlano")?.value;
      const plano = planosCache.find(p => p.id === planoId);
      if (plano && document.getElementById("alunoValor")) {
        document.getElementById("alunoValor").value = Number(plano.valor).toFixed(2);
      }
    }

    async function salvarAluno(event, id) {
      event.preventDefault();

      const planoId = document.getElementById("alunoPlano").value;
      const plano = planosCache.find(p => p.id === planoId);

      const payload = {
        nome: document.getElementById("alunoNome").value.trim(),
        telefone: document.getElementById("alunoTelefone").value.trim(),
        data_nascimento: document.getElementById("alunoNascimento").value || null,
        dia_vencimento: Number(document.getElementById("alunoVencimento").value),
        status: document.getElementById("alunoStatus").value,
        plano_id: planoId || null,
        valor_mensalidade: Number(document.getElementById("alunoValor").value || plano?.valor || 0),
        senha_treino: document.getElementById("alunoSenhaTreino").value.trim(),
        objetivo: document.getElementById("alunoObjetivo").value,
        lesoes_restricoes: document.getElementById("alunoLesoes").value.trim(),
        observacoes: document.getElementById("alunoObs").value.trim(),
        atualizado_em: new Date().toISOString()
      };

      if (!payload.nome) {
        mostrarToast("Informe o nome do aluno.", "error");
        return;
      }

      let res;

      if (id) {
        res = await client.from("alunos").update(payload).eq("id", id).select().single();
      } else {
        res = await client.from("alunos").insert(payload).select().single();
      }

      if (res.error) {
        mostrarToast("Erro ao salvar aluno: " + res.error.message, "error");
        return;
      }

      if (!id) {
        await criarMensalidadeInicial(res.data);
        await registrarLog(res.data.id, "Alunos", "Cadastro", "Aluno cadastrado no sistema.");
      } else {
        await registrarLog(id, "Alunos", "Edição", "Dados cadastrais atualizados.");
      }

      fecharModal();
      await carregarBase();
      await abrirTela("alunos");
      mostrarToast("Aluno salvo com sucesso.");
    }

    async function criarMensalidadeInicial(aluno) {
      if (!aluno.plano_id || !aluno.valor_mensalidade || !aluno.dia_vencimento) return;

      const venc = proximoVencimento(aluno.dia_vencimento);
      const comp = mesAnoDaData(venc);

      await client.from("mensalidades").insert({
        aluno_id: aluno.id,
        plano_id: aluno.plano_id,
        descricao: "Mensalidade",
        competencia_mes: comp.mes,
        competencia_ano: comp.ano,
        valor: Number(aluno.valor_mensalidade || 0),
        data_vencimento: venc,
        status: "Pendente"
      });
    }

    async function excluirAluno(id) {
      const aluno = alunosCache.find(a => a.id === id);
      if (!confirm(`Deseja realmente excluir/inativar o aluno ${aluno?.nome || ""}?`)) return;

      const { error } = await client
        .from("alunos")
        .update({ ativo: false, status: "Inativo", atualizado_em: new Date().toISOString() })
        .eq("id", id);

      if (error) {
        mostrarToast("Erro ao excluir aluno: " + error.message, "error");
        return;
      }

      await registrarLog(id, "Alunos", "Inativação", "Aluno marcado como inativo.");
      await carregarBase();
      await abrirTela("alunos");
      mostrarToast("Aluno inativado.");
    }

    async function abrirFichaAluno(id) {

        .select("*")
        .eq("aluno_id", id)
        .order("criado_em", { ascending: false });

      const { data: logs } = await client
        .from("logs_sistema")
        .select("*")
        .eq("aluno_id", id)
        .order("criado_em", { ascending: false })
        .limit(20);

      const html = `
        <div class="tabs">
          <button class="active" onclick="mostrarAbaFicha('dados')">Dados</button>
          <button onclick="mostrarAbaFicha('mensalidades')">Mensalidades</button>
          <button onclick="mostrarAbaFicha('conta')">Conta</button>
          <button onclick="mostrarAbaFicha('historico')">Histórico</button>
        </div>

        <div id="abaFichaDados">
          <div class="cards">
            <div class="card">
              <div class="kpi-label">Código</div>
              <div class="kpi-value">${aluno.codigo}</div>
            </div>
            <div class="card">
              <div class="kpi-label">Status</div>
              <div style="margin-top:12px;">${badgeStatusAluno(aluno.status)}</div>
            </div>
            <div class="card">
              <div class="kpi-label">Mensalidade</div>
              <div class="kpi-value">${BRL.format(Number(aluno.valor_mensalidade || 0))}</div>
            </div>
            <div class="card">
              <div class="kpi-label">Vencimento</div>
              <div class="kpi-value">Dia ${aluno.dia_vencimento || "-"}</div>
            </div>
          </div>

          <div class="panel">
            <p><strong>Nome:</strong> ${aluno.nome}</p><br>
            <p><strong>Telefone:</strong> ${aluno.telefone || "-"}</p><br>
            <p><strong>Objetivo:</strong> ${aluno.objetivo || "-"}</p><br>
            <p><strong>Restrições:</strong> ${aluno.lesoes_restricoes || "-"}</p><br>
            <p><strong>Observações:</strong> ${aluno.observacoes || "-"}</p><br>
            <p><strong>Senha do treino:</strong> ${aluno.senha_treino || "-"}</p>
          </div>
        </div>

        <div id="abaFichaMensalidades" class="hidden">
          ${renderTabelaMensalidadesSimples(mensalidades || [])}
        </div>

        <div id="abaFichaConta" class="hidden">
          ${renderLancamentosConta(lancamentos || [])}
        </div>

        <div id="abaFichaHistorico" class="hidden">
          ${
            logs?.length
              ? `<div class="debt-list">${logs.map(l => `
                  <div class="debt-item">
                    <div>
                      <strong>${l.acao}</strong>
                      <span>${l.modulo || "-"} | ${new Date(l.criado_em).toLocaleString("pt-BR")}</span>
                      <br><span>${l.descricao || ""}</span>
                    </div>
                  </div>
                `).join("")}</div>`
              : `<div class="empty">Nenhum histórico registrado.</div>`
          }
        </div>
      `;

      abrirModal(`Ficha do aluno`, `${aluno.codigo} - ${aluno.nome}`, html);
    }

    function mostrarAbaFicha(aba) {
      ["Dados", "Mensalidades", "Conta", "Historico"].forEach(nome => {
        document.getElementById("abaFicha" + nome)?.classList.add("hidden");
      });

      document.querySelectorAll(".tabs button").forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");

      const alvo = {
        dados: "abaFichaDados",
        mensalidades: "abaFichaMensalidades",
        conta: "abaFichaConta",
        historico: "abaFichaHistorico"
      }[aba];

      document.getElementById(alvo).classList.remove("hidden");
    }

    function renderTabelaMensalidadesSimples(lista) {
      if (!lista.length) return `<div class="empty">Nenhuma mensalidade encontrada.</div>`;

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Competência</th>
                <th>Vencimento</th>
                <th>Valor</th>
                <th>Status</th>
                <th>Pagamento</th>
              </tr>

            <tbody>
              ${lista.map(m => `
                <tr>
                  <td>${String(m.competencia_mes).padStart(2,"0")}/${m.competencia_ano}</td>

        .filter(l => l.status === "Em Aberto")
        .reduce((s, l) => s + Number(l.valor_total || 0), 0);

      return `

          ${lista.map(l => `
            <div class="debt-item">

                <strong>${l.descricao}</strong>

              <strong>${BRL.format(Number(l.valor_total || 0))}</strong>

    function filtrarMensalidades() {
      const busca = (document.getElementById("buscaMensalidade")?.value || "").toLowerCase();
      const status = document.getElementById("filtroStatusMensalidade")?.value || "";

      const lista = mensalidadesCache.filter(m => {
        const texto = `${m.alunos?.nome || ""} ${m.alunos?.codigo || ""}`.toLowerCase();
        const okBusca = texto.includes(busca);
        const okStatus = !status || m.status === status;
        return okBusca && okStatus;
      });

      const tbody = document.getElementById("tbodyMensalidades");
      if (!tbody) return;

      if (!lista.length) {
        tbody.innerHTML = `<tr><td colspan="8">Nenhuma mensalidade encontrada.</td></tr>`;
        return;
      }

      tbody.innerHTML = lista.map(m => `
        <tr>
          <td>
            <strong>${m.alunos?.nome || "-"}</strong><br>
            <span style="color:var(--muted);font-size:12px;">${m.alunos?.codigo || ""}</span>
          </td>
          <td>${m.planos?.nome || "-"}</td>
          <td>${String(m.competencia_mes).padStart(2,"0")}/${m.competencia_ano}</td>
          <td>${formatarData(m.data_vencimento)}</td>
          <td>${BRL.format(Number(m.valor || 0))}</td>
          <td>${badgeStatusMensalidade(m.status)}</td>
          <td>${m.forma_pagamento || "-"}</td>
          <td>
            <div class="actions">
              ${
                m.status !== "Pago" && m.status !== "Cancelado"
                  ? `<button class="btn btn-small btn-green" onclick="baixarMensalidade('${m.id}')">Baixar</button>`
                  : ""
              }
              <button class="btn btn-small btn-blue" onclick="mensagemWhatsappMensalidade('${m.id}')">Whats</button>
              ${
                m.status !== "Cancelado"
                  ? `<button class="btn btn-small btn-danger" onclick="cancelarMensalidade('${m.id}')">Cancelar</button>`
                  : ""
              }
            </div>
          </td>
        </tr>
      `).join("");
    }

    function badgeStatusMensalidade(status) {
      if (status === "Pago") return `<span class="badge green">Pago</span>`;
      if (status === "Vencido") return `<span class="badge red">Vencido</span>`;
      if (status === "Pendente") return `<span class="badge yellow">Pendente</span>`;
      if (status === "Cancelado") return `<span class="badge gray">Cancelado</span>`;
      return `<span class="badge gray">${status || "-"}</span>`;
    }

              <input id="mensalidadeValor" type="number" step="0.01" required />
            </div>

              <label>Data de vencimento</label>
              <input id="mensalidadeVencimento" type="date" required />
            </div>

            <div class="form-group span-2">

              <input id="mensalidadeDescricao" value="Mensalidade" />

            <button type="submit" class="btn btn-primary">Criar mensalidade</button>
          </div>
        </form>
      `;

      abrirModal("Nova mensalidade", "Cadastro manual de cobrança", html, true);
    }

    function preencherMensalidadeAluno() {
      const id = document.getElementById("mensalidadeAluno").value;
      const aluno = alunosCache.find(a => a.id === id);
      if (!aluno) return;
      document.getElementById("mensalidadeValor").value = Number(aluno.valor_mensalidade || 0).toFixed(2);
      document.getElementById("mensalidadeVencimento").value = proximoVencimento(aluno.dia_vencimento);
    }

    async function salvarMensalidadeManual(event) {
      event.preventDefault();

      const alunoId = document.getElementById("mensalidadeAluno").value;
      const aluno = alunosCache.find(a => a.id === alunoId);
      const venc = document.getElementById("mensalidadeVencimento").value;
      const comp = mesAnoDaData(venc);

      const { error } = await client.from("mensalidades").insert({
        aluno_id: alunoId,
        plano_id: aluno?.plano_id || null,
        descricao: document.getElementById("mensalidadeDescricao").value.trim() || "Mensalidade",
        competencia_mes: comp.mes,

        valor: Number(document.getElementById("mensalidadeValor").value || 0),

      });

      if (error) {
        mostrarToast("Erro ao criar mensalidade: " + error.message, "error");

      await registrarLog(alunoId, "Mensalidades", "Cadastro", "Mensalidade criada manualmente.");

      await carregarBase();
      await abrirTela("mensalidades");
      mostrarToast("Mensalidade criada.");

      const html = `

              <label>Aluno</label>

                <option>PIX</option>

              </select>

    async function confirmarBaixaMensalidade(event, id) {
      event.preventDefault();

      const m = mensalidadesCache.find(x => x.id === id);
      if (!m) return;

      const valor = Number(document.getElementById("baixaValor").value || 0);
      const forma = document.getElementById("baixaForma").value;
      const dataPag = document.getElementById("baixaData").value;

      const { error } = await client
        .from("mensalidades")
        .update({
          status: "Pago",
          data_pagamento: dataPag,
          forma_pagamento: forma,
          usuario_baixa_id: usuarioLogado.id,
          atualizado_em: new Date().toISOString()
        })
        .eq("id", id);

      if (error) {
        mostrarToast("Erro ao baixar mensalidade: " + error.message, "error");
        return;
      }

      await client.from("pagamentos").insert({
        aluno_id: m.aluno_id,
        origem: "Mensalidade",
        referencia_id: id,
        descricao: `${m.descricao} ${String(m.competencia_mes).padStart(2,"0")}/${m.competencia_ano}`,
        valor,
        forma_pagamento: forma,
        data_pagamento: dataPag,
        usuario_id: usuarioLogado.id
      });

      await client.rpc("criar_proxima_mensalidade", { p_mensalidade_id: id });

      await registrarLog(m.aluno_id, "Mensalidades", "Pagamento", `Mensalidade paga via ${forma}.`);

      fecharModal();
      await atualizarMensalidadesVencidas();
      await carregarBase();
      await abrirTela(telaAtual);
      mostrarToast("Pagamento registrado e próxima mensalidade gerada.");
    }

    async function cancelarMensalidade(id) {
      if (!confirm("Deseja cancelar esta mensalidade?")) return;

      const { error } = await client
        .from("mensalidades")
        .update({ status: "Cancelado", atualizado_em: new Date().toISOString() })
        .eq("id", id);

      if (error) {
        mostrarToast("Erro ao cancelar: " + error.message, "error");
        return;
      }

      await carregarBase();
      await abrirTela("mensalidades");
      mostrarToast("Mensalidade cancelada.");
    }

    function mensagemWhatsappMensalidade(id) {
      const m = mensalidadesCache.find(x => x.id === id);
      if (!m) return;

      const aluno = m.alunos;
      const telefone = limparTelefone(aluno?.telefone || "");

      const msg = `Olá, ${aluno?.nome || ""}! Tudo bem? Aqui é da LD Extreme Academia.%0A%0A` +
        `Passando para lembrar da sua mensalidade:%0A` +
        `Competência: ${String(m.competencia_mes).padStart(2,"0")}/${m.competencia_ano}%0A` +
        `Vencimento: ${formatarData(m.data_vencimento)}%0A` +
        `Valor: ${BRL.format(Number(m.valor || 0))}%0A%0A` +
        `Qualquer dúvida, estamos à disposição.`;

      if (telefone) {
        window.open(`https://wa.me/${telefone}?text=${msg}`, "_blank");
      } else {
        navigator.clipboard.writeText(decodeURIComponent(msg.replaceAll("%0A", "\n")));
        mostrarToast("Mensagem copiada. O aluno não possui telefone cadastrado.");
      }
    }

    function limparTelefone(tel) {
      const limpo = String(tel || "").replace(/\D/g, "");
      if (!limpo) return "";
      if (limpo.startsWith("55")) return limpo;
      return "55" + limpo;
    }

          ${
            vencidas.length

                      <tr>

                        <th>Vencimento</th>
                        <th>Dias em atraso</th>
                        <th>Valor</th>
                        <th>Ações</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${vencidas.map(m => {
                        const dias = calcularDiasAtraso(m.data_vencimento);
                        return `
                          <tr>
                            <td><strong>${m.alunos?.nome || "-"}</strong><br><span style="color:var(--muted);font-size:12px;">${m.alunos?.codigo || ""}</span></td>
                            <td>${m.alunos?.telefone || "-"}</td>
                            <td>${formatarData(m.data_vencimento)}</td>
                            <td><span class="badge red">${dias} dias</span></td>
                            <td>${BRL.format(Number(m.valor || 0))}</td>
                            <td>
                              <div class="actions">
                                <button class="btn btn-small btn-green" onclick="baixarMensalidade('${m.id}')">Baixar</button>
                                <button class="btn btn-small btn-blue" onclick="mensagemWhatsappMensalidade('${m.id}')">WhatsApp</button>
                              </div>
                            </td>
                          </tr>
                        `;
                      }).join("")}
                    </tbody>
                  </table>
                </div>
              `
              : `<div class="empty">Nenhum aluno em atraso no momento.</div>`
          }
        </div>
      `;

      document.getElementById("telaInadimplencia").innerHTML = html;
    }

    function calcularDiasAtraso(dataVencimento) {
      const venc = new Date(dataVencimento + "T00:00:00");
      const hoje = new Date();
      const diff = Math.floor((hoje - venc) / (1000 * 60 * 60 * 24));
      return Math.max(0, diff);
    }

        observacoes: document.getElementById("lancObs").value.trim()

        mostrarToast("Erro ao lançar: " + error.message, "error");

    async function confirmarBaixaLancamentoConta(event, id, alunoId) {
      event.preventDefault();

      const { data: lanc } = await client
        .from("conta_aluno_lancamentos")
        .select("*")
        .eq("id", id)
        .single();

      if (!lanc) {
        mostrarToast("Lançamento não encontrado.", "error");
        return;
      }

      const forma = document.getElementById("baixaLancForma").value;
      const data = document.getElementById("baixaLancData").value;

      const { error } = await client
        .from("conta_aluno_lancamentos")
        .update({
          status: "Pago",
          data_pagamento: data,
          atualizado_em: new Date().toISOString()
        })
        .eq("id", id);

      if (error) {
        mostrarToast("Erro ao baixar lançamento: " + error.message, "error");
        return;
      }

      await client.from("pagamentos").insert({
        aluno_id: alunoId,
        origem: "Conta do Aluno",
        referencia_id: id,
        descricao: lanc.descricao,
        valor: Number(lanc.valor_total || 0),
        forma_pagamento: forma,
        data_pagamento: data,
        usuario_id: usuarioLogado.id
      });

      await registrarLog(alunoId, "Conta do Aluno", "Pagamento", `${lanc.descricao} pago via ${forma}.`);

      fecharModal();
      await carregarBase();
      await abrirTela("contaAluno");
      document.getElementById("contaAlunoSelect").value = alunoId;
      await carregarContaAlunoSelecionado();
      mostrarToast("Lançamento pago.");
    }

    async function mensagemWhatsappContaAluno(alunoId) {
      const aluno = alunosCache.find(a => a.id === alunoId);

      const { data: mensalidades } = await client
        .from("mensalidades")
        .select("*")
        .eq("aluno_id", alunoId)
        .in("status", ["Pendente", "Vencido"]);

      const { data: lancamentos } = await client
        .from("conta_aluno_lancamentos")
        .select("*")
        .eq("aluno_id", alunoId)
        .eq("status", "Em Aberto");

      let linhas = [];
      let total = 0;

      (mensalidades || []).forEach(m => {
        const valor = Number(m.valor || 0);
        total += valor;
        linhas.push(`- Mensalidade ${String(m.competencia_mes).padStart(2,"0")}/${m.competencia_ano}: ${BRL.format(valor)}`);
      });

      (lancamentos || []).forEach(l => {
        const valor = Number(l.valor_total || 0);
        total += valor;
        linhas.push(`- ${l.descricao}: ${BRL.format(valor)}`);
      });

      const texto =
        `Olá, ${aluno?.nome || ""}! Tudo bem? Aqui é da LD Extreme Academia.\n\n` +
        `Segue o resumo da sua conta em aberto:\n\n` +
        `${linhas.join("\n")}\n\n` +
        `Total em aberto: ${BRL.format(total)}\n\n` +
        `Qualquer dúvida, estamos à disposição.`;

      const telefone = limparTelefone(aluno?.telefone || "");
      if (telefone) {
        window.open(`https://wa.me/${telefone}?text=${encodeURIComponent(texto)}`, "_blank");
      } else {
        navigator.clipboard.writeText(texto);
        mostrarToast("Mensagem copiada. O aluno não possui telefone cadastrado.");
      }
    }

async function salvarTreino(event, id = "") {
  event.preventDefault();

  const alunoId = id
    ? null
    : document.getElementById("treinoAluno").value;

  const payload = {
    professor: document.getElementById("treinoProfessor").value,
    titulo: document.getElementById("treinoTitulo").value.trim(),
    descricao: document.getElementById("treinoObservacoes").value.trim(),
    objetivo: document.getElementById("treinoObjetivo").value.trim(),
    data_inicio: document.getElementById("treinoDataInicio").value || null,
    semanas: document.getElementById("treinoSemanas").value ? Number(document.getElementById("treinoSemanas").value) : null,
    frequencia: document.getElementById("treinoFrequencia").value.trim(),
    mesociclo: document.getElementById("treinoMesociclo").value.trim(),
    observacoes: document.getElementById("treinoObservacoes").value.trim(),
    ativo: document.getElementById("treinoAtivo").value === "true",
    atualizado_em: new Date().toISOString()
  };

  let res;

  if (id) {
    res = await client
      .from("treinos")
      .update(payload)
      .eq("id", id)
      .select()
      .single();
  } else {
    payload.aluno_id = alunoId;

    res = await client
      .from("treinos")
      .insert(payload)
      .select()
      .single();
  }

  if (res.error) {
    mostrarToast("Erro ao salvar ficha: " + res.error.message, "error");
    return;
  }

  await registrarLog(
    res.data.aluno_id,
    "Treinos",
    id ? "Edição" : "Cadastro",
    id ? "Ficha de treino atualizada." : "Ficha de treino criada."
  );

  fecharModal();
  await abrirTela("treinos");

  const alunoSelecionado = res.data.aluno_id;
  document.getElementById("treinoAlunoFiltro").value = alunoSelecionado;
  await carregarTreinosAluno();

  mostrarToast("Ficha de treino salva.");
}

async function acessarTreinoPublico() {
  const codigo = document.getElementById("publicCodigoAluno").value.trim().toUpperCase();
  const senha = document.getElementById("publicSenhaTreino").value.trim();

  if (!codigo || !senha) {
    mostrarToast("Informe código e senha.", "error");

  const { data: aluno, error } = await client
    .from("alunos")
    .select("*")

    .eq("senha_treino", senha)
    .eq("ativo", true)
    .single();

  if (error || !aluno) {
    mostrarToast("Código ou senha inválidos.", "error");
    return;
  }

  const { data: treinos } = await client
    .from("treinos")
    .select("*")
    .eq("aluno_id", aluno.id)
    .eq("ativo", true)
    .order("criado_em", { ascending: false });

          <h2>${aluno.nome}</h2>
          <p>${aluno.codigo} | Ficha de treino online</p>
        </div>
      </div>
    </div>
  `;

  if (!treinos || !treinos.length) {
    html += `<div class="empty">Nenhum treino ativo cadastrado no momento.</div>`;
  } else {
    for (const treino of treinos) {
      const { data: exercicios } = await client
        .from("treino_exercicios")
        .select("*")
        .eq("treino_id", treino.id)
        .order("sessao")

function filtrarProdutos() {
  const busca = (document.getElementById("buscaProduto")?.value || "").toLowerCase();
  const categoria = document.getElementById("filtroCategoriaProduto")?.value || "";

  const lista = produtosCache.filter(p => {
    const texto = `${p.codigo_barras || ""} ${p.nome || ""} ${p.categoria || ""}`.toLowerCase();
    const okBusca = texto.includes(busca);
    const okCategoria = !categoria || p.categoria === categoria;
    return okBusca && okCategoria;
  });

  const tbody = document.getElementById("tbodyProdutos");
  if (!tbody) return;

  if (!lista.length) {
    tbody.innerHTML = `<tr><td colspan="8">Nenhum produto encontrado.</td></tr>`;
    return;
  }

  tbody.innerHTML = lista.map(p => {
    const baixo = Number(p.quantidade_estoque || 0) <= Number(p.estoque_minimo || 0);

    return `
      <tr>
        <td>${p.codigo_barras || "-"}</td>
        <td>
          <strong>${p.nome}</strong>
          ${p.descricao ? `<br><span style="color:var(--muted);font-size:12px;">${p.descricao}</span>` : ""}
        </td>
        <td>${p.categoria || "-"}</td>
        <td>${BRL.format(Number(p.preco_venda || 0))}</td>
        <td>${baixo ? `<span class="badge red">${p.quantidade_estoque}</span>` : `<span class="badge green">${p.quantidade_estoque}</span>`}</td>
        <td>${p.estoque_minimo || 0}</td>
        <td>${p.ativo ? `<span class="badge green">Ativo</span>` : `<span class="badge gray">Inativo</span>`}</td>
        <td>
          <div class="actions">
            <button class="btn btn-small btn-yellow" onclick="abrirModalProduto('${p.id}')">Editar</button>
            <button class="btn btn-small btn-blue" onclick="abrirModalMovimentacaoProduto('${p.id}')">Estoque</button>
          </div>
        </td>
      </tr>
    `;
  }).join("");
}

async function salvarProduto(event, id) {
  event.preventDefault();

  const payload = {
    codigo_barras: document.getElementById("produtoCodigoBarras").value.trim() || null,
    nome: document.getElementById("produtoNome").value.trim(),
    categoria: document.getElementById("produtoCategoria").value,

  };

                      <td>${m.produtos?.nome || "-"}</td>

                      <td>${m.quantidade}</td>
                      <td>${m.estoque_anterior ?? "-"}</td>
                      <td>${m.estoque_atual ?? "-"}</td>
                      <td>${m.observacao || "-"}</td>
                    </tr>
                  `).join("")}

              </table>
            </div>
          `
          : `<div class="empty">Nenhuma movimentação registrada.</div>`
      }
    </div>

  document.getElementById("telaEstoque").innerHTML = html;
}

function badgeTipoEstoque(tipo) {
  if (tipo === "Entrada") return `<span class="badge green">Entrada</span>`;
  if (tipo === "Saída") return `<span class="badge red">Saída</span>`;
  if (tipo === "Venda") return `<span class="badge yellow">Venda</span>`;
  if (tipo === "Ajuste") return `<span class="badge gray">Ajuste</span>`;
  return `<span class="badge gray">${tipo}</span>`;
}

function abrirModalMovimentacaoProduto(produtoId = "") {
  const produtoOptions = produtosCache.filter(p => p.ativo !== false).map(p => `
    <option value="${p.id}" ${produtoId === p.id ? "selected" : ""}>
      ${p.nome} | Estoque: ${p.quantidade_estoque}

async function salvarMovimentacaoEstoque(event) {
  event.preventDefault();

  const produtoId = document.getElementById("movProduto").value;
  const tipo = document.getElementById("movTipo").value;
  const qtd = Number(document.getElementById("movQuantidade").value || 0);
  const obs = document.getElementById("movObs").value.trim();

  const produto = produtosCache.find(p => p.id === produtoId);
  if (!produto) {
    mostrarToast("Produto não encontrado.", "error");
    return;
  }

  const estoqueAnterior = Number(produto.quantidade_estoque || 0);
  let estoqueAtual = estoqueAnterior;

  if (tipo === "Entrada") estoqueAtual = estoqueAnterior + qtd;
  if (tipo === "Saída") estoqueAtual = estoqueAnterior - qtd;
  if (tipo === "Ajuste") estoqueAtual = qtd;

  if (estoqueAtual < 0) {
    mostrarToast("Estoque não pode ficar negativo.", "error");
    return;
  }

  const { error: erroProduto } = await client
    .from("produtos")
    .update({
      quantidade_estoque: estoqueAtual,
      atualizado_em: new Date().toISOString()
    })
    .eq("id", produtoId);

  if (erroProduto) {
    mostrarToast("Erro ao atualizar produto: " + erroProduto.message, "error");
    return;
  }

  const { error: erroMov } = await client.from("movimentacoes_estoque").insert({
    produto_id: produtoId,
    tipo,
    quantidade: qtd,
    estoque_anterior: estoqueAnterior,
    estoque_atual: estoqueAtual,
    observacao: obs,
    usuario_id: usuarioLogado.id
  });

  if (erroMov) {
    mostrarToast("Erro ao registrar movimentação: " + erroMov.message, "error");
    return;
  }

  fecharModal();
  await carregarBase();
  await abrirTela("estoque");
  mostrarToast("Estoque atualizado.");
}

function ajustarTipoVenda() {
  const tipo = document.getElementById("vendaTipo")?.value;
  const aluno = document.getElementById("vendaAluno");
  const forma = document.getElementById("vendaForma");
  const avulso = document.getElementById("vendaClienteAvulso");

  if (!aluno || !forma || !avulso) return;

  if (tipo === "Anotada na Conta") {
    aluno.querySelector('option[value=""]').disabled = true;
    forma.disabled = true;
    avulso.disabled = true;
    avulso.value = "";
  } else {
    aluno.querySelector('option[value=""]').disabled = false;
    forma.disabled = false;
    avulso.disabled = false;
  }
}

function atalhoCodigoBarrasVenda(event) {
  if (event.key === "Enter") {
    event.preventDefault();
    adicionarProdutoVenda();
  }
}

function encontrarProdutoVenda(texto) {
  const termo = String(texto || "").trim().toLowerCase();

  if (!termo) return null;

  let produto = produtosCache.find(p =>
    String(p.codigo_barras || "").toLowerCase() === termo &&
    p.ativo !== false
  );

  if (produto) return produto;

  produto = produtosCache.find(p =>
    String(p.nome || "").toLowerCase().includes(termo) &&
    p.ativo !== false
  );

  return produto || null;
}

function adicionarProdutoVenda() {
  const busca = document.getElementById("vendaBuscaProduto").value.trim();
  const qtd = Number(document.getElementById("vendaQtdProduto").value || 1);

  const produto = encontrarProdutoVenda(busca);

  if (!produto) {
    mostrarToast("Produto não encontrado.", "error");
    return;
  }

  if (qtd <= 0) {
    mostrarToast("Quantidade inválida.", "error");
    return;
  }

  if (Number(produto.quantidade_estoque || 0) < qtd) {
    mostrarToast("Estoque insuficiente para este produto.", "error");
    return;
  }

  const existente = carrinhoVenda.find(i => i.produto_id === produto.id);

  if (existente) {
    const novaQtd = existente.quantidade + qtd;

    if (Number(produto.quantidade_estoque || 0) < novaQtd) {
      mostrarToast("Estoque insuficiente para esta quantidade.", "error");
      return;
    }

    existente.quantidade = novaQtd;
    existente.valor_total = existente.quantidade * existente.valor_unitario;
  } else {
    carrinhoVenda.push({
      produto_id: produto.id,
      produto_nome: produto.nome,
      quantidade: qtd,
      valor_unitario: Number(produto.preco_venda || 0),
      valor_total: qtd * Number(produto.preco_venda || 0),
      estoque_atual: Number(produto.quantidade_estoque || 0)
    });
  }

  document.getElementById("vendaBuscaProduto").value = "";
  document.getElementById("vendaQtdProduto").value = 1;
  renderCarrinhoVenda();
  mostrarToast("Produto adicionado.");
}

function renderCarrinhoVenda() {
  const box = document.getElementById("carrinhoVendaBox");
  if (!box) return;

  if (!carrinhoVenda.length) {
    box.className = "empty";
    box.innerHTML = "Nenhum item adicionado.";
    return;
  }

  const total = carrinhoVenda.reduce((s, i) => s + Number(i.valor_total || 0), 0);

  box.className = "";
  box.innerHTML = `
    <div class="debt-list">
      ${carrinhoVenda.map((i, index) => `
        <div class="debt-item">
          <div>
            <strong>${i.produto_nome}</strong>
            <span>Qtd: ${i.quantidade} | Unitário: ${BRL.format(i.valor_unitario)}</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <strong>${BRL.format(i.valor_total)}</strong>
            <button class="btn btn-small btn-danger" onclick="removerItemCarrinho(${index})">Remover</button>
          </div>
        </div>
      `).join("")}
    </div>

    <div class="total-box">
      <span>Total da venda</span>
      <strong>${BRL.format(total)}</strong>
    </div>
  `;
}

function removerItemCarrinho(index) {
  carrinhoVenda.splice(index, 1);
  renderCarrinhoVenda();
}

function limparCarrinhoVenda() {
  carrinhoVenda = [];
  renderCarrinhoVenda();
}

async function finalizarVenda() {
  const tipo = document.getElementById("vendaTipo").value;
  const alunoId = document.getElementById("vendaAluno").value || null;
  const forma = document.getElementById("vendaForma").value;
  const clienteNome = document.getElementById("vendaClienteAvulso").value.trim();

  if (!carrinhoVenda.length) {
    mostrarToast("Adicione pelo menos um produto.", "error");
    return;
  }

  if (tipo === "Anotada na Conta" && !alunoId) {
    mostrarToast("Venda anotada só pode ser feita para aluno cadastrado.", "error");
    return;
  }

  const total = carrinhoVenda.reduce((s, i) => s + Number(i.valor_total || 0), 0);

  for (const item of carrinhoVenda) {
    const produto = produtosCache.find(p => p.id === item.produto_id);

    if (!produto || Number(produto.quantidade_estoque || 0) < item.quantidade) {
      mostrarToast(`Estoque insuficiente para ${item.produto_nome}.`, "error");
      return;
    }
  }

  const { data: venda, error: erroVenda } = await client
    .from("vendas")
    .insert({
      aluno_id: alunoId,
      cliente_nome: clienteNome || null,
      tipo_venda: tipo,
      forma_pagamento: tipo === "Paga na Hora" ? forma : null,
      valor_total: total,
      status: tipo === "Paga na Hora" ? "Concluída" : "Pendente",
      usuario_id: usuarioLogado.id
    })
    .select()
    .single();

  if (erroVenda) {
    mostrarToast("Erro ao criar venda: " + erroVenda.message, "error");
    return;
  }

  for (const item of carrinhoVenda) {
    await client.from("venda_itens").insert({
      venda_id: venda.id,
      produto_id: item.produto_id,
      produto_nome: item.produto_nome,
      quantidade: item.quantidade,
      valor_unitario: item.valor_unitario,
      valor_total: item.valor_total
    });

    const produto = produtosCache.find(p => p.id === item.produto_id);
    const estoqueAnterior = Number(produto.quantidade_estoque || 0);
    const estoqueAtual = estoqueAnterior - item.quantidade;

    await client
      .from("produtos")
      .update({
        quantidade_estoque: estoqueAtual,
        atualizado_em: new Date().toISOString()
      })
      .eq("id", item.produto_id);

    await client.from("movimentacoes_estoque").insert({
      produto_id: item.produto_id,
      tipo: "Venda",
      quantidade: item.quantidade,
      estoque_anterior: estoqueAnterior,
      estoque_atual: estoqueAtual,
      observacao: `Venda ${tipo}`,
      usuario_id: usuarioLogado.id
    });

    if (tipo === "Anotada na Conta") {
      await client.from("conta_aluno_lancamentos").insert({
        aluno_id: alunoId,
        tipo: "Produto",
        referencia_id: venda.id,
        descricao: item.produto_nome,
        quantidade: item.quantidade,
        valor_unitario: item.valor_unitario,
        valor_total: item.valor_total,
        status: "Em Aberto",
        usuario_id: usuarioLogado.id,
        observacoes: "Venda anotada na conta do aluno"
      });
    }
  }

  if (tipo === "Paga na Hora") {
    await client.from("pagamentos").insert({
      aluno_id: alunoId,
      origem: "Produto",
      referencia_id: venda.id,
      descricao: "Venda de produtos",
      valor: total,
      forma_pagamento: forma,
      data_pagamento: hojeISO(),
      usuario_id: usuarioLogado.id
    });
  }

  if (alunoId) {
    await registrarLog(
      alunoId,
      "Vendas",
      tipo,
      `Venda registrada no valor de ${BRL.format(total)}.`
    );
  }

  carrinhoVenda = [];
  await carregarBase();
  await abrirTela("vendas");

  mostrarToast(
    tipo === "Paga na Hora"
      ? "Venda finalizada e estoque baixado."
      : "Venda anotada na conta do aluno e estoque baixado."
  );
 }

        vezes_semana: Number(document.getElementById("planoVezes").value || 0),
        valor: Number(document.getElementById("planoValor").value || 0),
        ativo: document.getElementById("planoAtivo").value === "true"
      };

      let res;

      if (id) {
        res = await client.from("planos").update(payload).eq("id", id);
      } else {
        res = await client.from("planos").insert(payload);
      }

      if (res.error) {
        mostrarToast("Erro ao salvar plano: " + res.error.message, "error");
        return;
      }

      fecharModal();
      await carregarBase();
      await abrirTela("planos");
      mostrarToast("Plano salvo.");
    }

    async function registrarLog(alunoId, modulo, acao, descricao) {
      await client.from("logs_sistema").insert({
        usuario_id: usuarioLogado?.id || null,
        aluno_id: alunoId || null,
        modulo,
        acao,
        descricao
      });
    }
  </script>
</body>
</html>
